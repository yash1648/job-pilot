# JobPilot — base configuration (all profiles)
# Profile-specific overrides live in application-{dev,test,staging,prod}.yaml
spring:
  application:
    name: jobpilot
  autoconfigure:
    exclude:
      # Our auth is JWT-only (UserService.authenticate + JwtAuthenticationFilter);
      # no UserDetailsService/AuthenticationManager bean is defined, so without
      # this exclusion Boot auto-configures an in-memory user and logs a
      # "generated security password" warning on every boot.
      # Boot 4.1: the class lives in spring-boot-security (new package).
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    default-property-inclusion: non_null
  servlet:
    # align with storage max-size (doc 22 §4) so Spring rejects oversized
    # uploads before they reach the storage service
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      repositories:
        # No Redis repositories exist yet (JPA only). The starter stays for the
        # planned rate-limiter (TASK-JP-0023), but disabling repo scanning
        # prevents Spring Data from probing every JPA repo and warning.
        enabled: false

server:
  port: 8080

# JWT (doc 22 §1) — secret MUST come from env in any real environment
jobpilot:
  security:
    jwt:
      secret: ${JOBPILOT_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
      access-ttl-minutes: 15
      refresh-ttl-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# Structured JSON logging (doc 29 §1) — modules/trace fields added by common
logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","module":"${JOBPILOT_MODULE:-app}","traceId":"%X{traceId:-}","candidateProfileId":"%X{candidateProfileId:-}","event":"%.-1msg","details":"%.-1000msg%nopex"}'
