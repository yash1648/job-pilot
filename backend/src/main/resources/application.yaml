# JobPilot — base configuration (all profiles)
# Profile-specific overrides live in application-{dev,test,staging,prod}.yaml
spring:
  application:
    name: jobpilot
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

# JWT (doc 22 §1) — secret MUST come from env in any real environment
jobpilot:
  security:
    jwt:
      secret: ${JOBPILOT_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
      access-ttl-minutes: 15
      refresh-ttl-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# Structured JSON logging (doc 29 §1) — modules/trace fields added by common
logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","module":"${JOBPILOT_MODULE:-app}","traceId":"%X{traceId:-}","candidateProfileId":"%X{candidateProfileId:-}","event":"%.-1msg","details":"%.-1000msg%nopex"}'
