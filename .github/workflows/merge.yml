name: Merge / Nightly Full Suite

# doc 33 §8 / doc 26 §5: the slow, costly suites (real-model AI integration,
# and later workflow/browser/E2E/AI-eval/browser-eval) run on merge-to-main
# and nightly — visible but NOT blocking every PR.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # nightly 03:00 UTC

jobs:
  full:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Scanned-PDF OCR tests need the Tesseract native library on Linux
      # (tess4j does not bundle it — see TASK-JP-0010).
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      # Full suite INCLUDING @Tag("slow") (real-Ollama integration, OCR). The slow
      # tests self-skip via Assumptions when their engine is unreachable, so this
      # never hard-fails solely for lack of a model/OCR in CI.
      - name: Full suite (incl. slow AI/OCR suites)
        run: ./mvnw -B test
