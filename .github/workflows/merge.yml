name: Merge / Nightly Full Suite

# doc 33 §8 / doc 26 §5: the slow, costly suites (real-model AI integration,
# and later workflow/browser/E2E/AI-eval/browser-eval) run on merge-to-main
# and nightly — visible but NOT blocking every PR.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # nightly 03:00 UTC

jobs:
  full:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Full suite INCLUDING @Tag("slow") (real-Ollama integration). The slow
      # test self-skips via Assumptions when Ollama is unreachable, so this
      # never hard-fails solely for lack of a model in CI.
      - name: Full suite (incl. slow AI/browser suites)
        run: ./mvnw -B test
