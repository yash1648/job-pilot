name: CI PR Gate

# doc 33 §8 / doc 26 §5: lint + unit + integration + API + database +
# security tests on every PR, BEFORE merge. Slow AI/browser suites are
# deliberately excluded here (run on merge + nightly instead) so a missing
# local model or a costly suite never blocks a PR.
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile (static/lint gate)
        run: ./mvnw -B compile

  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Docker is available on GitHub runners for Testcontainers (Postgres/Redis).
      # excludedGroups=slow keeps the real-Ollama integration test out of the PR gate.
      - name: Unit + integration + API + DB + security tests
        run: ./mvnw -B test -DexcludedGroups=slow

  build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Produces the deployable artifact (doc 33 §8 "build image" step).
      # Swap for spring-boot:build-image + registry push when a registry exists.
      - name: Package
        run: ./mvnw -B package -DskipTests
